name: Auto transcribe and summarize

# 1日2回(日本時間 07:30 と 19:30)、Driveの未処理の音声を「文字起こし→タイトル→要約→Driveに保存」まで自動処理する。
# 毎朝06:00(JST)のPlaud→Driveバックアップ(gensai870/plaud)の後に動くよう、朝の実行は07:30にしている。
# Web画面の「バックグラウンドで処理」ボタンからは file_ids を渡して手動起動される。
on:
  schedule:
    - cron: '30 22 * * *'   # 07:30 JST
    - cron: '30 10 * * *'   # 19:30 JST
  workflow_dispatch:
    inputs:
      file_ids:
        description: '処理するDriveファイルID(カンマ区切り)。空なら、開始日以降の未処理の音声'
        required: false
        default: ''
      max_files:
        description: '今回処理する最大件数(空なら30件)。試運転のときは小さい数にする'
        required: false
        default: ''

concurrency:
  group: auto-process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Process files
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Googleのクライアントシークレットは使わず、mojioko本体から短時間有効なDriveトークンを受け取る
          JOB_TOKEN_URL: https://mojioko.vercel.app/api/drive/job-token
          JOB_SHARED_SECRET: ${{ secrets.JOB_SHARED_SECRET }}
          AUTO_SOURCE_FOLDER_ID: ${{ secrets.AUTO_SOURCE_FOLDER_ID }}
          AUTO_SINCE: '2026-09-01'   # この日より前の録音は自動処理しない
          MAX_FILES_PER_RUN: ${{ github.event.inputs.max_files || '30' }}
          GOOGLE_DRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_UPLOAD_FOLDER_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FILE_IDS: ${{ github.event.inputs.file_ids }}
        run: |
          if [ -z "$XAI_API_KEY" ] || [ -z "$SUPABASE_DB_URL" ] || [ -z "$JOB_SHARED_SECRET" ] || [ -z "$AUTO_SOURCE_FOLDER_ID" ]; then
            echo "::warning::必要なSecretsが未設定のため、今回の自動処理はスキップしました(PROGRESS.mdの「バックグラウンド処理の設定」を参照)"
            exit 0
          fi
          node scripts/auto-process.js
