<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mojioko Web版(試験)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="logo">mojioko</span>
    <span class="tagline">Web版(試験) — 減災協会 音声文字起こし</span>
  </div>
</header>

<main>
  <div class="card">
    <h2>① Groq APIキー</h2>
    <p class="help-text">
      <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a> で発行したキーを入力してください。
      このブラウザにのみ保存され、サーバーには保存されません。
    </p>
    <input type="password" id="groqKeyInput" placeholder="gsk_...">
  </div>

  <div class="card">
    <h2>② 音声を入力</h2>
    <div class="dropzone" id="dropzone">
      <div class="big">クリックまたはドラッグ&ドロップでファイルを選択</div>
      <div class="small">MP3, WAV, M4A, MP4, FLAC, OGG</div>
      <input type="file" id="fileInput" accept=".mp3,.wav,.m4a,.mp4,.flac,.ogg,.opus,audio/*">
    </div>
    <div class="file-chip" id="fileChip" style="display:none;">
      <span id="fileChipName"></span>
      <button id="fileChipClear">✕</button>
    </div>
    <div class="or-divider">または URL</div>
    <input type="url" id="urlInput" placeholder="https://.../recording.mp3">
  </div>

  <div class="card">
    <h2>③ 出力オプション</h2>
    <div class="field-row">
      <div class="field">
        <label>出力形式</label>
        <select id="optFormat">
          <option value="timestamp">タイムスタンプ付き</option>
          <option value="plain">プレーンテキスト</option>
          <option value="srt">SRT</option>
          <option value="vtt">VTT</option>
          <option value="json">JSON</option>
        </select>
      </div>
      <div class="field">
        <label>言語</label>
        <select id="optLanguage">
          <option value="ja">日本語</option>
          <option value="auto">自動判定</option>
          <option value="en">英語</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="btn-row">
      <button class="btn btn-primary" id="startBtn">文字起こしを開始</button>
    </div>
    <div class="progress-wrap" id="progressWrap" style="display:none;">
      <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-label"><span id="progressText">0 / 0</span></div>
    </div>
    <div class="terminal" id="terminal"></div>
  </div>

  <div class="card result-box" id="resultCard" style="display:none;">
    <h2>結果</h2>
    <textarea id="resultText" readonly></textarea>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn btn-sm" id="copyResultBtn">コピー</button>
      <button class="btn btn-sm" id="downloadResultBtn">ダウンロード</button>
    </div>
  </div>

  <p class="footer-note">
    試験版(Vercelホスティング)につき、長時間の録音は処理に時間がかかる場合があります。タブを閉じずにお待ちください。
  </p>
</main>

<div class="toast-stack" id="toastStack"></div>

<script src="audioSplit.js"></script>
<script src="app.js"></script>
</body>
</html>
